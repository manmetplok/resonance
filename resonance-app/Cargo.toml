[package]
name = "resonance-app"
version = "0.1.0"
edition = "2021"

[dependencies]
resonance-audio = { path = "../resonance-audio" }
resonance-common = { path = "../resonance-common" }
resonance-control = { path = "../resonance-control" }
# The mastering assistant's analysis and decision engine, for
# `master.assist` (warmth-width-depth.md §7.4). A library crate the
# mastering plugin shares, so the app links no plugin.
resonance-mastering-assist = { path = "../resonance-mastering-assist" }
resonance-metering = { path = "../resonance-metering" }
resonance-music-theory = { path = "../resonance-music-theory" }
resonance-plugin = { path = "../resonance-plugin" }
resonance-svs = { path = "../resonance-svs" }
iced = { workspace = true, features = ["canvas", "wgpu", "tokio", "lazy", "advanced"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
rfd.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
base64.workspace = true
printpdf = { version = "0.12", default-features = false }
time = { workspace = true, features = ["formatting", "parsing"] }
# Subscriber installed in `main.rs` only (ARCH-05 A5-1).
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The engine-internals test surface (`resonance_audio::test_support`, ARCH-03)
# for tests only; resolver 2 keeps it out of `cargo build -p resonance-app`.
resonance-audio = { path = "../resonance-audio", features = ["test-internals"] }
iced_test = "0.14"
tempfile = "3"
hound.workspace = true
