[package]
name = "resonance-plugin"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
# egui widget helpers bound to this crate's param types, for plugin editors
# built on `plugin-gui-core` widgets + the platform GUI runtime. Off by
# default so DSP-only consumers stay lean. The runtime deps live in target
# tables below, so enabling the feature pulls in only the platform's own
# runtime (`dep:` entries for the other target are ignored there).
editor-widgets = [
    "dep:wayland-plugin-gui",
    "dep:cocoa-plugin-gui",
    "dep:plugin-gui-core",
    "dep:rfd",
]

[dependencies]
base64.workspace = true
clack-plugin = { workspace = true }
clack-extensions = { workspace = true }
resonance-common = { path = "../resonance-common", default-features = false }
# User-preset directory resolution ($XDG_DATA_HOME/resonance/plugin-presets).
dirs.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Installed once per CLAP bundle (`logging.rs`): a cdylib carries its own
# copy of the tracing dispatcher, so the host's subscriber never sees its
# events (ARCH-05).
tracing-subscriber.workspace = true
plugin-gui-core = { path = "../plugin-gui-core", optional = true }
# The preset browser's Import / Export file dialogs (editor only).
rfd = { workspace = true, optional = true }

# The platform GUI runtimes behind `editor_host::RuntimeEditor`. Target-gated
# so each platform builds only its own windowing stack; both crates stay
# workspace members so `-p` addressing works everywhere regardless.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-plugin-gui = { path = "../wayland-plugin-gui", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa-plugin-gui = { path = "../cocoa-plugin-gui", optional = true }

[dev-dependencies]
# Drive the CLAP bridge from the host side in tests (activate + latency query).
clack-host = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-host"] }

# Depending on ourselves as a dev-dependency turns `editor-widgets` on for the
# test build only, leaving `default = []` alone so DSP-only consumers stay lean.
#
# Without this, `tests/preset_bar_render.rs` is `#![cfg(feature =
# "editor-widgets")]` around its whole body, so a plain `cargo test -p
# resonance-plugin` compiles it to an empty binary and reports "0 passed" —
# a test that passes by not existing. `cargo check --workspace --all-targets`
# does enable the feature through unification, so it type-checked and looked
# covered while never once executing (ba doc #285).
resonance-plugin = { path = ".", features = ["editor-widgets"] }
