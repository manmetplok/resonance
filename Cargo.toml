[workspace]
members = ["resonance-audio", "resonance-app", "resonance-common", "resonance-control", "resonance-dsp", "resonance-dsp-test-support", "resonance-mcp", "resonance-mastering-assist", "resonance-metering", "resonance-music-theory", "resonance-plugin", "resonance-svs", "plugin-gui-core", "wayland-plugin-gui", "cocoa-plugin-gui", "plugins/resonance-delay", "plugins/resonance-granular-delay", "plugins/resonance-drums", "plugins/resonance-amp", "plugins/resonance-color", "plugins/resonance-compressor", "plugins/resonance-eq", "plugins/resonance-gate", "plugins/resonance-ir", "plugins/resonance-mastering", "plugins/resonance-reverb", "plugins/resonance-stereo", "plugins/resonance-wavetable", "tools/arch-invariants"]
resolver = "2"

[workspace.dependencies]
clack-plugin = { git = "https://github.com/prokopyl/clack.git", rev = "4541f03792635dfdc6be9441a01b786e9b4ccf18" }
clack-extensions = { git = "https://github.com/prokopyl/clack.git", rev = "4541f03792635dfdc6be9441a01b786e9b4ccf18", features = [
    "clack-plugin", "audio-ports", "params", "state", "note-ports", "latency", "gui", "render",
    "state-context", "preset-discovery"
] }
# Host side of clack, used by resonance-plugin's tests to drive the CLAP
# bridge through the real C ABI (instantiate → activate → latency query).
clack-host = { git = "https://github.com/prokopyl/clack.git", rev = "4541f03792635dfdc6be9441a01b786e9b4ccf18", default-features = false, features = ["clack-plugin"] }
thiserror = "2"
# Logging facade (ARCH-05). Library crates depend on `tracing` only; the
# subscriber is installed by the binaries (the app, and each CLAP bundle via
# `resonance-plugin`, whose cdylib carries its own copy of the dispatcher).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
egui = { version = "0.34", features = ["default_fonts"], default-features = false }
egui_glow = { version = "0.34", default-features = false }
iced = { version = "0.14" }
hound = "3.5"
rand = "0.10"
rfd = "0.17"
rustfft = "6"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "aac", "isomp4"] }
dirs = "6"
time = "0.3"
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
arc-swap = "1"
midir = "0.10"
schemars = "1"
# Benchmark harness. `default-features = false` + `cargo_bench_support` keeps
# the dependency tree small (no plotters/gnuplot HTML report generation).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# DEP-09 (code-review-2026-10-02): versions pinned per crate instead of
# here caused avoidable duplicate copies in the lock file (base64 0.22
# vs. the 0.23 ureq/rmcp already pull in; two libc tables in
# resonance-audio alone). Moved here so a crate that needs extra
# features adds them with `features = [...]` on top of this entry
# rather than repeating (and risking drifting) the base version.
base64 = "0.23"
glow = "0.17"
# Must track clack's own clap-sys version (resonance-plugin's CLAP ABI
# bridge and clack both talk to the same C headers).
clap-sys = "0.5"
tokio = "1"
anyhow = "1"
libc = "0.2"
libloading = "0.8"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
# CLAP plugins ship as cdylibs that the host loads via dlopen. Setting
# codegen-units = 1 lets LLVM inline across the whole crate (per-CGU
# borders are inlining barriers); the DSP-heavy plugin code benefits
# noticeably from this. Trade-off: longer release builds.
codegen-units = 1
# DEP-10 (code-review-2026-10-02): the bundled .clap files were shipping
# ~18% symtab/strtab (gate.clap: 2.1 MB of 11.7 MB) nothing dlopens by
# name — a plugin exports exactly 2 dynamic symbols (the CLAP entry
# point table). "debuginfo" rather than "symbols": nothing in this
# workspace installs a panic hook that captures a `Backtrace`, but the
# default one still prints a symbolicated stack on `RUST_BACKTRACE=1`
# off the binary's symbol table, and that's worth keeping for a release
# build a crash report comes back from; "symbols" would reduce every
# frame to a bare address. DWARF line tables (the bulk of "debuginfo")
# aren't needed since nothing here reads them outside a debugger.
strip = "debuginfo"

# The app isn't a dlopen'd cdylib and doesn't benefit the way the DSP
# plugin cdylibs do from cross-CGU inlining, so give it its build time
# back: 16 codegen units instead of the workspace-wide 1.
[profile.release.package.resonance-app]
codegen-units = 16

# Compile resonance-dsp at -O2 even in debug builds so debug runs of the
# audio engine don't dropout under realtime load. Other crates stay at
# the default -O0 so build times and step debugging are unaffected.
[profile.dev.package.resonance-dsp]
opt-level = 2

# Sample decoding lives here (`decode_wav_stereo`), and the drum-kit tests
# decode the whole multi-mic Drummica library. Unoptimized that is 38s per
# test and over half the wall clock of the entire workspace suite
# (ba doc #285 §3).
[profile.dev.package.resonance-common]
opt-level = 2

# DEP-11 (code-review-2026-10-02): wgpu/naga/iced/ort/zbus/etc. all build
# with full (debug = 2) debuginfo by default, which is most of the disk
# cost of a `target/debug` tree (worktrees have piled up to 629 GB across
# ~16 of them). `package."*"` only ever matches *dependency* packages —
# never the current workspace's own members — so this does not touch
# resonance-dsp's or resonance-common's `opt-level` overrides above, and
# every workspace crate keeps full (line + variable) debug info; only the
# third-party dependency tree drops to file/line tables.
[profile.dev.package."*"]
debug = "line-tables-only"
