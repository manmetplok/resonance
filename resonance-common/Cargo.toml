[package]
name = "resonance-common"
version = "0.1.0"
edition = "2021"
description = "Shared utilities for Resonance plugins"

[features]
default = ["model", "decode"]
# The nine DAW-model modules: take, midi_map, device_definition, automation,
# freeze, device_registry, group_identity, external_instrument, track_group.
# Not plugin API (ARCHITECTURE.md) — a plugin that sets
# `default-features = false` cannot name any of these types (ARCH-07 A7-3).
#
# `dirs` and `time` stay plain (non-optional) dependencies rather than
# gated-optional ones: the plan named them as "optional under model", but
# the utility modules — always compiled regardless of features — call
# them too (`drumkit_library`, `library_marks` and `nam_library` use
# `dirs`; `drumkit_library` and `library_marks` use `time`; `grep -rn
# 'dirs::\|time::' resonance-common/src`). Gating them behind `model` would break a
# `decode`-only or utility-only build that never touches the model modules.
model = []
# WAV decode + audio-file probing; the only consumer of `symphonia`.
decode = ["dep:symphonia"]
# Kit import / install from a `.zip` (`drumkit_library::{import_zip,
# install_zip, install_zip_replacing}`, and `import` of a `.zip`). Off by
# default so a plugin or the app that never unpacks a kit does not compile
# `zip` + its deflate backends; the drums plugin turns it on.
drumkit-zip = ["dep:zip"]

[dependencies]
symphonia = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
# RFC 3339 timestamps in the library marks store (`library_marks`).
time = { workspace = true, features = ["formatting", "parsing"] }
tracing.workspace = true
thiserror.workspace = true
# Content ids of NAM models (`nam_library`): sha256 of the file bytes.
sha2 = "0.10"
# Kit import from a .zip (`drumkit_library`, feature `drumkit-zip`); the
# same build the drums plugin's downloader uses, so the workspace compiles
# one zip.
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

# The import disk check (`drumkit_library::free_space`, statvfs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The zip tests of `drumkit_library` build archives and need the feature.
# That self-dependency activates the optional `zip` dep above for the
# whole test build already, so a second direct `zip` dev-dependency here
# was a duplicate (DEP-08) — `tests/drumkit_library.rs`'s `use zip::...`
# resolves against the one above.
resonance-common = { path = ".", features = ["drumkit-zip"] }
