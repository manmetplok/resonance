[package]
name = "resonance-music-theory"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Music theory primitives (pitch, chord, scale) for Resonance"

[dependencies]
cmudict-fast = "0.8.0"
phf = { version = "0.14", features = ["macros"] }
serde.workspace = true
strum = { version = "0.28", features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
