[package]
name = "resonance-audio"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.17"
crossbeam-channel.workspace = true
parking_lot.workspace = true
ringbuf = "0.5"
clap-sys.workspace = true
libloading.workspace = true
indexmap = "2"
resonance-common = { path = "../resonance-common" }
resonance-dsp = { path = "../resonance-dsp" }
# Scale/key snap for vocal-tuning retune on the render + bounce path
# (doc #160, todo #358). No path-dependency cycle: music-theory depends on
# neither resonance-audio nor resonance-dsp.
resonance-music-theory = { path = "../resonance-music-theory" }
# Loudness measurement (integrated LUFS + 4× oversampled true peak) and the
# polyphase true-peak detector reused by the export normalization pass.
resonance-metering = { path = "../resonance-metering" }
hound.workspace = true
midly = "0.5"
midir.workspace = true
arc-swap.workspace = true
memmap2 = "0.9"
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
flacenc = { version = "0.5.1", default-features = false, features = ["par"] }
rubato = "0.16"
# MP3 export (libmp3lame, built from bundled C source — no system lib).
# Gated behind the `mp3` feature so a build without a C toolchain can opt
# out and degrade to ExportErrorKind::EncoderUnavailable (todo #653).
mp3lame-encoder = { version = "0.2", optional = true }
# Opus/Ogg export (libopus + the Ogg container muxer). `opus` links the
# system libopus; `ogg` is the pure-Rust container writer. Gated behind the
# `opus` feature so a build without libopus opts out and degrades to
# ExportErrorKind::EncoderUnavailable (todo #651).
opus = { version = "0.3", optional = true }
ogg = { version = "0.9", optional = true }

[features]
# MP3 + Opus encoder sinks. On by default so exports offer them out of the
# box; build with `--no-default-features` (or drop the individual feature)
# when a C toolchain / libmp3lame source build or system libopus is
# unavailable — the affected format then reports EncoderUnavailable.
default = ["mp3", "opus"]
mp3 = ["dep:mp3lame-encoder"]
opus = ["dep:opus", "dep:ogg"]
# The engine-internals test surface (`resonance_audio::test_support` and
# the other gated re-exports in `src/lib.rs`, code review ARCH-03). No
# normal dependency enables it: only this crate's own tests and benches
# (the self dev-dependency below) and resonance-app's dev-dependency do.
test-internals = []

[dev-dependencies]
base64.workspace = true
# Turns on `test-internals` for this crate's own tests and benches. As a
# dev-dependency, resolver 2 unifies the feature into test/bench builds
# only — `cargo build` of this crate or of resonance-app never sees it.
resonance-audio = { path = ".", features = ["test-internals"] }
# Used by tests/io/import_audio_to_pool.rs to author mono / multi-rate
# source WAVs (the public `transcode_to_wav` only writes stereo).
hound.workspace = true
# Used by tests/types/clip_warp.rs for WarpMarker / WarpAlgorithm serde round-trips,
# and tests/bounce/export_settings.rs for ExportSettings serde round-trips.
serde_json.workspace = true
# Per-block render-path benchmarks (benches/render_path.rs).
criterion.workspace = true

[[bench]]
name = "render_path"
harness = false

# Render-pool stress project with real plugins (needs scripts/bundle.sh).
[[bench]]
name = "render_pool"
harness = false

# `pthread_{get,set}schedparam`/`gettid` (linux, render_pool::sched) and
# `pthread_main_np` (macos, engine/plugins.rs's debug-build deadlock-rule
# assertion) both come from libc — one `cfg(unix)` table instead of
# repeating the pin per platform (DEP-09, code-review-2026-10-02).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.3"
pipewire = { version = "0.9", features = ["v0_3_49"] }
