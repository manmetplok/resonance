[package]
name = "resonance-eq"
version = "0.1.0"
edition = "2021"
description = "An 8-band parametric EQ CLAP plugin in the spirit of FabFilter Pro-Q 3"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Editor shipped by default so the cdylib bundle has a GUI.
# Turn it off (`--no-default-features`) for a headless DSP build.
default = ["editor"]
editor = [
    "dep:plugin-gui-core",
    # the shared preset bar (ba todo #1358) lives behind this feature
    "resonance-plugin/editor-widgets",
]

[dependencies]
resonance-plugin = { path = "../../resonance-plugin" }
resonance-common = { path = "../../resonance-common" }
resonance-dsp = { path = "../../resonance-dsp" }
# Spectrum analyzer stack (SPSC ring + background FFT worker). Not gated
# on `editor`: the audio thread's ring push lives in `process()`, which is
# compiled in headless builds too — same shape as resonance-mastering.
resonance-metering = { path = "../../resonance-metering" }
serde_json.workspace = true
parking_lot.workspace = true

# Only the platform-neutral half of the editor stack is named here. The
# platform GUI runtime (Wayland today, Cocoa on macOS) is selected by
# `resonance-plugin`'s `editor-widgets` feature and reached through
# `resonance_plugin::editor_host`; `egui` comes via `plugin_gui_core::egui`
# (ARCH-08).
plugin-gui-core = { path = "../../plugin-gui-core", optional = true }

[dev-dependencies]
criterion.workspace = true
resonance-dsp-test-support = { path = "../../resonance-dsp-test-support" }

# Per-block DSP benchmark. `harness = false` hands main() to criterion.
[[bench]]
name = "eq_dsp"
harness = false
