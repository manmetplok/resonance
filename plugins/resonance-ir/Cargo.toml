[package]
name = "resonance-ir"
version = "0.1.0"
edition = "2021"
description = "An impulse response convolution CLAP plugin for cab and room emulation"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# The editor is enabled by default so the bundled .clap ships with a GUI.
# Turn it off (`--no-default-features`) for headless builds.
default = ["editor"]
editor = ["dep:plugin-gui-core", "dep:rfd", "resonance-plugin/editor-widgets"]
# Test-only surface on `IrEngine` (FU-D1a1): lets a test replace the
# janitor-backed swap-fader retire sink with its own channel, so it can
# fill every parking slot deterministically instead of racing a live
# thread. No normal dependency enables it — only this crate's own dev-
# dependency below (mirrors resonance-audio's `test-internals`).
test-internals = []

[dependencies]
resonance-plugin = { path = "../../resonance-plugin" }
resonance-common = { path = "../../resonance-common", default-features = false, features = [
    "decode",
] }
resonance-dsp = { path = "../../resonance-dsp" }
resonance-metering = { path = "../../resonance-metering" }
parking_lot.workspace = true
rustfft.workspace = true
serde_json.workspace = true

# Editor dependencies — only pulled in when the `editor` feature is on.
# Only the platform-neutral half of the editor stack is named here. The
# platform GUI runtime (Wayland today, Cocoa on macOS) is selected by
# `resonance-plugin`'s `editor-widgets` feature and reached through
# `resonance_plugin::editor_host`; `egui` comes via `plugin_gui_core::egui`
# (ARCH-08).
plugin-gui-core = { path = "../../plugin-gui-core", optional = true }
rfd = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
resonance-dsp-test-support = { path = "../../resonance-dsp-test-support" }
# Turns on `test-internals` for this crate's own tests and benches only
# (resolver 2 unifies the feature into test/bench builds; a normal build
# of this crate never sees it).
resonance-ir = { path = ".", features = ["test-internals"] }
# `tests/latency_mode_host.rs` drives a real (in-process) CLAP host across
# the C ABI, which is the only way to exercise the host handle a runtime
# latency change goes through.
clack-host = { workspace = true }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-host"] }

# Per-block DSP benchmark. `harness = false` hands main() to criterion.
[[bench]]
name = "ir_dsp"
harness = false
