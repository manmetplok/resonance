[package]
name = "resonance-gate"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "A stereo noise gate / downward expander CLAP plugin with an external sidechain key"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Editor ships by default so the bundled .clap has a GUI.
# Turn it off (`--no-default-features`) for a headless DSP build.
default = ["editor"]
editor = ["dep:plugin-gui-core", "resonance-plugin/editor-widgets"]

[dependencies]
resonance-plugin = { path = "../../resonance-plugin" }
resonance-dsp = { path = "../../resonance-dsp" }
resonance-metering = { path = "../../resonance-metering" }

# Only the platform-neutral half of the editor stack is named here. The
# platform GUI runtime (Wayland today, Cocoa on macOS) is selected by
# `resonance-plugin`'s `editor-widgets` feature and reached through
# `resonance_plugin::editor_host`; `egui` comes via `plugin_gui_core::egui`
# (ARCH-08).
plugin-gui-core = { path = "../../plugin-gui-core", optional = true }

[dev-dependencies]
# Only the factory-preset test parses JSON directly; the plugin itself
# loads presets through `resonance_plugin::presets`, which carries its
# own serde_json. This was a normal dependency that nothing used at all
# (ba todo #1330, finding C4).
serde_json.workspace = true
resonance-dsp-test-support = { path = "../../resonance-dsp-test-support" }

# `tests/state.rs` drives this plugin through a real (in-process) CLAP host
# across the C ABI, which is the only way to reach the state path the bridge
# takes while the plugin is active and its object lives in the audio processor.
clack-host = { workspace = true }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-host"] }

# The NSApplication pump for tests/editor_open_cocoa.rs (its module docs
# say why the Cocoa round trip cannot run under libtest). The runtime
# itself still arrives through resonance-plugin's RuntimeEditor pair.
[target.'cfg(target_os = "macos")'.dev-dependencies]
cocoa-plugin-gui = { path = "../../cocoa-plugin-gui" }

# The macOS editor round trip (plan §3f). `harness = false` because the
# scenario needs the main thread handed to NSApplication; without
# `--ignored` it skips, so the default suite stays headless on both OSes.
[[test]]
name = "editor_open_cocoa"
path = "tests/editor_open_cocoa.rs"
harness = false
