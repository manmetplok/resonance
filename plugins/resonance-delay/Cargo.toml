[package]
name = "resonance-delay"
version = "0.1.0"
edition = "2021"
description = "A tempo-synced stereo delay with digital and analog modes"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["editor"]
editor = ["dep:wayland-plugin-gui", "dep:egui",
    # the shared preset bar (ba todo #1358) lives behind this feature
    "resonance-plugin/editor-widgets",
]

[dependencies]
resonance-plugin = { path = "../../resonance-plugin" }
resonance-common = { path = "../../resonance-common" }
resonance-dsp = { path = "../../resonance-dsp" }
serde_json.workspace = true

wayland-plugin-gui = { path = "../../wayland-plugin-gui", optional = true }
egui = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true

# Per-block DSP benchmark. `harness = false` hands main() to criterion.
[[bench]]
name = "delay_dsp"
harness = false
