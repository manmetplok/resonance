[package]
name = "resonance-drums"
version = "0.1.0"
edition = "2021"
description = "A drum sampler instrument CLAP plugin for the Resonance DAW"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# The editor is enabled by default so the bundled .clap ships with a GUI.
# Turn it off (`--no-default-features`) for headless builds.
default = ["editor"]
editor = [
    "dep:plugin-gui-core",
    "dep:rfd",
    "dep:ureq",
    "dep:zip",
    "dep:dirs",
    # the shared preset bar (ba todo #1358) lives behind this feature
    "resonance-plugin/editor-widgets",
]

[dependencies]
resonance-plugin = { path = "../../resonance-plugin" }
resonance-common = { path = "../../resonance-common" }
resonance-dsp = { path = "../../resonance-dsp" }

serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true

# Editor dependencies — only pulled in when the `editor` feature is on.
# Only the platform-neutral half of the editor stack is named here. The
# platform GUI runtime (Wayland today, Cocoa on macOS) is selected by
# `resonance-plugin`'s `editor-widgets` feature and reached through
# `resonance_plugin::editor_host`; `egui` comes via `plugin_gui_core::egui`
# (ARCH-08).
plugin-gui-core = { path = "../../plugin-gui-core", optional = true }
rfd = { workspace = true, optional = true }

# Drumkit download — gated behind the `editor` feature so headless builds
# stay lean.
ureq = { version = "3", features = ["json"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
dirs = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
resonance-dsp-test-support = { path = "../../resonance-dsp-test-support" }

# Per-block DSP benchmark. `harness = false` hands main() to criterion.
[[bench]]
name = "drums_dsp"
harness = false
