[package]
name = "resonance-amp"
version = "0.1.0"
edition = "2021"
description = "A guitar amp simulator CLAP plugin using Neural Amp Modeler models"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# The editor is enabled by default so the bundled .clap ships with a GUI.
# Turn it off (`--no-default-features`) for headless builds.
default = ["editor"]
# Test-only surface on `AmpProcessor` (FU-D1a1): lets a test replace the
# janitor-backed swap-fader retire sink with its own channel, so it can
# fill every parking slot deterministically instead of racing a live
# thread. No normal dependency enables it — only this crate's own dev-
# dependency below (mirrors resonance-audio's `test-internals`).
test-internals = []
editor = [
    "dep:plugin-gui-core",
    "resonance-plugin/editor-widgets",
    "dep:rfd",
    "dep:ureq",
    "dep:tiny_http",
    "dep:sha2",
    "dep:base64",
    "dep:getrandom",
    "dep:webbrowser",
]

[dependencies]
resonance-plugin = { path = "../../resonance-plugin" }
resonance-common = { path = "../../resonance-common", default-features = false }
resonance-dsp = { path = "../../resonance-dsp" }
# Not editor-gated: `viz.rs`'s meter/scope state is shared with the audio
# path regardless of whether the editor feature is built.
resonance-metering = { path = "../../resonance-metering" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Not editor-gated: `initialize()` seeds the model browser from the
# downloads directory, and a headless build has to find it too.
dirs.workspace = true

# Editor dependencies — only pulled in when the `editor` feature is on.
# Only the platform-neutral half of the editor stack is named here. The
# platform GUI runtime (Wayland today, Cocoa on macOS) is selected by
# `resonance-plugin`'s `editor-widgets` feature and reached through
# `resonance_plugin::editor_host`; `egui` comes via `plugin_gui_core::egui`
# (ARCH-08).
plugin-gui-core = { path = "../../plugin-gui-core", optional = true }
rfd = { workspace = true, optional = true }

# Tone3000 browser — all optional and gated behind the `editor` feature
# so headless builds stay lean.
ureq = { workspace = true, optional = true }
tiny_http = { version = "0.12", optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# PKCE verifier/challenge + OAuth state nonce (DEP-09: `rand` was the only
# user, for 64-80 raw random bytes — `getrandom` alone does that with a
# far smaller dependency tree).
getrandom = { version = "0.4", optional = true }
webbrowser = { version = "1", optional = true }

[dev-dependencies]
criterion.workspace = true
resonance-dsp-test-support = { path = "../../resonance-dsp-test-support" }
# Turns on `test-internals` for this crate's own tests and benches only
# (resolver 2 unifies the feature into test/bench builds; a normal build
# of this crate never sees it).
resonance-amp = { path = ".", features = ["test-internals"] }
# `tests/state.rs` drives this plugin through a real (in-process) CLAP host
# across the C ABI, which is the only way to reach the state path the bridge
# takes while the plugin is active and its object lives in the audio processor.
clack-host = { workspace = true }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-host"] }

# Per-block DSP benchmark. `harness = false` hands main() to criterion.
[[bench]]
name = "amp_dsp"
harness = false

[[bench]]
name = "matvec"
harness = false
