[package]
name = "resonance-wavetable"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "A wavetable synthesizer instrument CLAP plugin for the Resonance DAW"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# The editor is enabled by default so the cdylib bundle ships with a GUI.
# Turn it off (`--no-default-features`) to get a headless build for tests.
default = ["editor"]
editor = ["dep:plugin-gui-core",
    # the shared preset bar (ba todo #1358) lives behind this feature
    "resonance-plugin/editor-widgets",
    # the per-osc "Load…" file dialog for user wavetables
    "dep:rfd",
]

[dependencies]
resonance-plugin = { path = "../../resonance-plugin" }
resonance-dsp = { path = "../../resonance-dsp" }
serde_json.workspace = true
# User wavetables (`user_wavetable`): WAV decode, the FFT the runtime mip
# builder and the single-cycle resampler run on, and the base64 the imported
# frames are embedded in plugin state with. Not editor-gated: state restore
# rebuilds the table headless too.
hound.workspace = true
rustfft.workspace = true
base64.workspace = true
parking_lot.workspace = true
tracing.workspace = true

# Editor dependencies — only pulled in when the `editor` feature is on.
# Only the platform-neutral half of the editor stack is named here. The
# platform GUI runtime (Wayland today, Cocoa on macOS) is selected by
# `resonance-plugin`'s `editor-widgets` feature and reached through
# `resonance_plugin::editor_host`; `egui` comes via `plugin_gui_core::egui`
# (ARCH-08).
plugin-gui-core = { path = "../../plugin-gui-core", optional = true }
rfd = { workspace = true, optional = true }

[build-dependencies]
resonance-dsp = { path = "../../resonance-dsp" }

[dev-dependencies]
criterion.workspace = true
resonance-dsp-test-support = { path = "../../resonance-dsp-test-support" }
# `tests/state.rs` drives this plugin through a real (in-process) CLAP host
# across the C ABI, which is the only way to reach the state path the bridge
# takes while the plugin is active and its object lives in the audio processor.
clack-host = { workspace = true }
clack-plugin = { workspace = true }
clack-extensions = { workspace = true, features = ["clack-host"] }

# Synth DSP benchmarks. Run headless:
#   cargo bench -p resonance-wavetable --no-default-features
[[bench]]
name = "synth"
harness = false

[[example]]
name = "editor_standalone"
path = "examples/editor_standalone.rs"
required-features = ["editor"]
